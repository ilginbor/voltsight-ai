name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python fresh-clone tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fresh-clone Python test suite
        shell: pwsh
        run: |
          # These integration/data-validation modules intentionally require
          # generated GeoPackage/CSV pipeline artifacts that are gitignored
          # and therefore are not present in a clean GitHub Actions checkout.
          #
          # They remain part of the local full validation command:
          #   python -m pytest -q
          #
          # CI runs the deterministic fresh-clone-safe suite instead.
          python -m pytest -q `
            --ignore=tests/test_charging_features.py `
            --ignore=tests/test_diverse_candidate_shortlist.py `
            --ignore=tests/test_merge_charging_station_sources.py `
            --ignore=tests/test_model_dataset.py `
            --ignore=tests/test_parking_features.py `
            --ignore=tests/test_prepare_epdk_charging_report.py `
            --ignore=tests/test_road_features.py `
            --ignore=tests/test_study_grid.py `
            --ignore=tests/test_suitability_scores.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build
